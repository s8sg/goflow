name: GO-Flow-Build

on: [push]

jobs:

  checks:
    name: Unit test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - run: make
      - uses: actions/upload-artifact@v4
        with:
          name: coverage.html
          path: /tmp/coverage.html
